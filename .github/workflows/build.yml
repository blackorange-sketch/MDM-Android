name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust core (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libmdm_android_core.so
        run: |
          # NDK 27: bindgen (QuickJS bindings) fails on the newest NDK with an unversioned target.
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          export ANDROID_NDK_HOME="$NDK"
          echo "Using NDK $ANDROID_NDK_HOME"
          cargo ndk --platform 26 -t arm64-v8a -o android/app/src/main/jniLibs build --release -p mdm-android-core
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs

  apk:
    name: APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch crates (Gradle asks Cargo where the TLS verifier's Kotlin part is)
        run: cargo fetch
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MDM-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
