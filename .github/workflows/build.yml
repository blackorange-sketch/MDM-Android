name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust core (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libmdm_android_core.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk --platform 26 -t arm64-v8a -o android/app/src/main/jniLibs build --release -p mdm-android-core
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs

  apk:
    name: APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch crates (Gradle asks Cargo where the TLS verifier's Kotlin part is)
        run: cargo fetch
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MDM-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
