[package]
name = "mdm-android-core"
description = "JNI bridge from the Android app to the Mister Download Manager engine and torrents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mdm_android_core"
crate-type = ["cdylib"]

[dependencies]
# Upstream (GPL-3.0), fetched at a pinned revision and patched by scripts/prepare-upstream.sh.
# The browser-like connection (BoringSSL) is left out: it is only for sites whose bot check
# refuses plain clients.
mdm-engine = { path = "../third_party/mdm/crates/engine", default-features = false }
mdm-torrent = { path = "../third_party/mdm/crates/torrent" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
url = "2"
http = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Android's certificate verifier needs a Kotlin part in the app (see app/settings.gradle.kts).
# The same version as upstream's, so Cargo keeps one copy.
rustls-platform-verifier = "0.7.1"
# The jni the verifier is written against (0.22); only used to hand it the app context.
jni22 = { package = "jni", version = "0.22" }

# QuickJS (proxy auto-config scripts in the engine) ships no ready bindings for Android: they are
# made from its C headers while building (needs libclang; cargo-ndk points it at the NDK).
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "bindgen"] }
