[package]
name = "mdm-android-core"
description = "JNI bridge from the Android app to the Mister Download Manager engine and torrents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mdm_android_core"
crate-type = ["cdylib"]

[dependencies]
# Upstream: https://github.com/anefzaoui/misterdownloadmanager (GPL-3.0). The browser-like
# connection (BoringSSL) is left out: it is only for sites whose bot check refuses plain clients.
mdm-engine = { git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "3bb924491549a2085d8d6795fd630cf6fa2a14c5", default-features = false }
mdm-torrent = { git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "3bb924491549a2085d8d6795fd630cf6fa2a14c5" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
url = "2"
http = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Android's certificate verifier needs a Kotlin part in the app (see app/settings.gradle.kts).
# The same version as upstream's, so Cargo keeps one copy.
rustls-platform-verifier = "0.7.1"
